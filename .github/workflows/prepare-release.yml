name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        description: Version type
        required: true
        options:
          - "patch"
          - "minor"
          - "major"
        default: "patch"

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
        with:
          # generate-changelog needs full history to find the last tag; a shallow clone
          # makes it silently produce an empty entry (see the 5.1.0 entry in CHANGELOG.md).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Upgrade npm to v11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Enforce coverage
        run: npm run enforce

      - name: Generate changelog
        run: npm run changelog:${{ github.event.inputs.version }}

      - name: Bump version (no commit or tag yet, that happens after this PR merges)
        run: npm version "${{ github.event.inputs.version }}" --no-git-tag-version

      - name: Read new version
        id: new_version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.email "no-reply@lob.com"
          git config --global user.name "NPM Publish Action"
          BRANCH="release/${{ steps.new_version.outputs.version }}"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore: release v${{ steps.new_version.outputs.version }}"
          # --force so re-running for the same version overwrites the branch instead of failing.
          git push --force origin "$BRANCH"
          gh pr create \
            --title "chore: release v${{ steps.new_version.outputs.version }}" \
            --body "Version bump and changelog for v${{ steps.new_version.outputs.version }}, opened by the Prepare Release workflow. Merging this triggers the actual npm publish." \
            --base main \
            --head "$BRANCH" \
            --label "automated-release" \
            || echo "PR for $BRANCH already exists, branch was updated above"
