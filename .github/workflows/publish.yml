name: NPM Publish

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    # Branch prefix + label together so an unrelated release/* PR can't trigger a publish.
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      contains(github.event.pull_request.labels.*.name, 'automated-release')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for publishing using OIDC authentication
      contents: write # Required to push the release tag (tags aren't branch-protected)

    services:
      redis:
        image: redis
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps port 6379 on service container to the host
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
        with:
          # Pin to the merge commit, not main's tip, which could move if another release merges first.
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Upgrade npm to v11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Enforce coverage
        run: npm run enforce

      - name: Publish package
        uses: JS-DevTools/npm-publish@v4

      # If this fails, the package is live but untagged, a manual git tag/push away from fixed.
      - name: Tag the release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git tag "v$VERSION"
          git push origin "v$VERSION"
